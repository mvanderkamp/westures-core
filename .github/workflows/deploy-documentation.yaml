---
name: Build and Deploy

on:
  push:
    branches:
      - deploy-docs

  # This allows manual triggers. Select the branch you want to deploy as the
  # branch to run the workflow from.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    # Recommended if you intend to make multiple deployments in quick
    # succession.
    concurrency: ci-${{ github.ref }}

    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This example project is built using npm and outputs the result to the
      # 'docs' folder.
      - name: 🔧 Install and Build
        run: |
          npm ci
          npm run docs

      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          # The folder the action should deploy.
          folder: docs
